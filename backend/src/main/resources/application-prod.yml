# application-prod.yml — override ค่าตอน deploy จริง
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 604800000
    refresh-token-expiry: 604800000

logging:
  level:
    com.banking: INFO            # production log น้อยลง
    org.springframework.security: WARN

# Swagger ปิดใน production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

finnhub:
  api:
    key: ${FINNHUB_API_KEY}